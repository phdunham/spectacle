# Spectacle project definition.
#
# The Xcode project is generated from this file with XcodeGen:
#
#     brew install xcodegen
#     xcodegen generate
#
# Edit this file (not Spectacle.xcodeproj) when adding files, targets or build settings.
name: Spectacle
options:
  bundleIdPrefix: com.divisiblebyzero
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

# Code signing lives in Configuration/Signing.xcconfig (ad hoc by default), which includes the
# optional, git-ignored Configuration/Local.xcconfig for a personal signing identity.
configFiles:
  Debug: Configuration/Signing.xcconfig
  Release: Configuration/Signing.xcconfig

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The app and its tests are Swift 6 with complete concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  Spectacle:
    type: application
    platform: macOS
    sources:
      - path: Spectacle/Sources
      - path: Spectacle/Resources/Images.xcassets
      - path: Spectacle/Resources/Localizations
      - path: Spectacle/Resources/Property Lists
    settings:
      base:
        PRODUCT_NAME: Spectacle
        PRODUCT_BUNDLE_IDENTIFIER: com.divisiblebyzero.Spectacle
        INFOPLIST_FILE: Spectacle/Supporting Files/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Spectacle
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postBuildScripts:
      - name: Set build number from git
        basedOnDependencyAnalysis: false
        script: |
          if command -v git >/dev/null 2>&1 && git -C "${SRCROOT}" rev-parse HEAD >/dev/null 2>&1; then
            build_number=$(git -C "${SRCROOT}" rev-list HEAD --count)
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${build_number}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi

  SpectacleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpectacleTests
    dependencies:
      - target: Spectacle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divisiblebyzero.SpectacleTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spectacle.app/Contents/MacOS/Spectacle"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Spectacle:
    build:
      targets:
        Spectacle: all
        SpectacleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Spectacle
      targets:
        - name: SpectacleTests
          randomExecutionOrder: true
    archive:
      config: Release
